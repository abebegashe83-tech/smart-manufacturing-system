services:
  - type: web
    name: smart-manufacturing-system-api
    runtime: python
   
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: smart-manufacturing-system-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-manufacturing-system.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: smart-manufacturing-system-db
          property: connectionString

  - type: web
    name: smart-manufacturing-system
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-manufacturing-system-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smart-manufacturing-system-db
    plan: free
    databaseName: smart_manufacturing
    user: smart_manufacturing
